<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Nexus Global | Elite Training</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --text: #c9d1d9;
            --accent: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
            border: 1px solid #30363d;
        }
        h1 { color: #ffffff; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #8b949e; font-size: 1rem; margin-bottom: 2rem; }
        .btn {
            display: block;
            background-color: var(--accent);
            color: #ffffff;
            padding: 0.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
