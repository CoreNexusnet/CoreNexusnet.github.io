<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Nexus Global | Formación de Elite</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --text: #c9d1d9;
            --accent-blue: #58a6ff;
            --accent-green: #2ea44f;
            --border: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
            border: 1px solid var(--border);
        }
        h1 { color: #ffffff; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #8b949e; font-size: 1rem; margin-bottom: 2rem; }
        .btn {
            display: block;
            color: #ffffff;
            padding: 0.9rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 1.2rem;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn-blue { background-color: var(--accent-blue); }
        .btn-green { background-color: var(--accent-green); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Core Nexus Global</h1>
        <p>Sistemas Inteligentes & Automatización de Alto Impacto.</p>
        
        <a href="https://go.hotmart.com/A106435547L" target="_blank" class="btn btn-blue">
            Máster en Automatización e IA
        </a>
        
        <a href="https://go.hotmart.com/B106435549F" target="_blank" class="btn btn-green">
            Master en Automatización de Negocios
        </a>
    </div>
</body>
</html>
